version: '3.8'

services:
  mysql_user:
    image: mysql:latest
    container_name: mysql_user
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: user_service_app
    ports:
      - "3307:3306"
    volumes:
      - mysql_user_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  user_service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql_user:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_user:3306/user_service_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpass
    volumes:
      - ./user-service/logs:/logs

  mongo_course:
    image: mongo:latest
    container_name: mongo_course
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_course_data:/data/db

  course_service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: course_service
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mongo_course
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo_course:27017/course_service_app
    volumes:
      - ./course-service/logs:/logs

volumes:
  mysql_user_data:
  mongo_course_data: