version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: mongo_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  course_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course_service
    restart: unless-stopped
    ports:
      - "8001:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/course_service_app
      SERVER_PORT: 8081
    volumes:
      - ./logs:/logs

volumes:
  mongo_data: